<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Oshiami：英文、數學、語文互動學習</title>
  <desc id="description">紙張與墨色風格的三學科學習室品牌卡</desc>
  <rect width="1200" height="630" fill="#f4f1e9"/>
  <path d="M0 1h1200M0 629h1200" stroke="#1d2a3d" stroke-width="2"/>

  <g transform="translate(72 66)">
