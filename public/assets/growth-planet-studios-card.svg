  <text x="174" y="106" fill="#1d2a3d" font-family="Avenir Next, PingFang TC, Noto Sans TC, sans-serif" font-size="29" font-weight="700" letter-spacing="3">Oshiami</text>
  <text x="72" y="223" fill="#1d2a3d" font-family="Iowan Old Style, Songti TC, Noto Serif TC, serif" font-size="60" font-weight="600">一堂課，一個能力，</text>
  <text x="72" y="299" fill="#1d2a3d" font-family="Iowan Old Style, Songti TC, Noto Serif TC, serif" font-size="60" font-weight="600">清楚看見下一步。</text>
  <text x="74" y="367" fill="#5f6a7e" font-family="Avenir Next, PingFang TC, Noto Sans TC, sans-serif" font-size="25">把孩子的實際操作，變成可理解的成長證據。</text>

